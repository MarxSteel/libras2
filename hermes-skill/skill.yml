name: libras
version: 0.1.0
description: >
  Traduz Português para Libras e responde com vídeo/GIF.
  Trigger explícito: "!libras <texto>". Auto-trigger: frases contendo
  "em libras", "em sinais" ou "libras por favor".
entrypoint: handler.py
type: messaging
platforms: [whatsapp, telegram]
author: MarxSteel
homepage: https://github.com/MarxSteel/vlibras
license: MIT
config:
  VLIBRAS_API_URL:
    type: string
    default: http://127.0.0.1:8088
    description: URL base do serviço vlibras
  VLIBRAS_MEDIA_CACHE:
    type: string
    default: /tmp/vlibras-media
    description: Diretório local onde o vídeo baixado fica antes de enviar
requires:
  - service: vlibras
    health: http://127.0.0.1:8088/health
