<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>libras2 player</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif;
           background: #0a0a0a; color: #e0e0e0;
           min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 22px; border-bottom: 1px solid #222;
             display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .gloss { background: #1a1a1a; padding: 4px 10px; border-radius: 4px;
             font-family: ui-monospace, monospace; font-size: 12px; color: #7af; }
    main { flex: 1; display: flex; align-items: center; justify-content: center;
           padding: 20px; }
    .text { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
            padding: 30px 50px; max-width: 600px; text-align: center;
            font-size: 28px; line-height: 1.4; color: #e0e0e0;
            position: relative; }
    .text::before { content: "🤟"; position: absolute; top: -20px; left: 20px;
                    font-size: 32px; }
    .text[hidden] { display: none; }
    .controls { display: flex; gap: 8px; margin-left: auto; }
    button { background: #1f6feb; color: white; border: 0; padding: 6px 14px;
             border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:hover { background: #2680ff; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .hint { font-size: 11px; color: #888; padding: 8px 22px;
            border-top: 1px solid #1a1a1a; background: #050505; }
    .hint b { color: #7af; }

    /* VLibras widget — força o player a ficar grande no centro */
    [vw] { left: 0 !important; right: 0 !important; bottom: 0 !important;
           top: 0 !important; width: 100% !important; }
    [vw-access-button] { display: none !important; }
    div[vw-plugin-wrapper] { width: 100% !important; height: 80vh !important;
                              left: 0 !important; right: 0 !important;
                              bottom: 0 !important; top: 60px !important;
                              transform: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>🤟 libras2 player</h1>
    <span class="gloss" id="gloss">—</span>
    <div class="controls">
      <button id="btn-play" disabled>▶ Tocar de novo</button>
    </div>
  </header>

  <main>
    <div class="text" id="text-display" hidden></div>
  </main>

  <div class="hint">
    💡 Dica: o widget do VLibras é o <b>player oficial</b> (avatar 3D animado). Ele escaneia o texto da página e traduz.
    Aperte <b>▶ Tocar de novo</b> pra repetir. Pra gravar como MP4/GIF, use gravação de tela do Mac (Cmd+Shift+5).
  </div>

  <!-- VLibras widget oficial (player Unity embarcado) -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper></div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>

  <script>
    const params = new URLSearchParams(location.search);
    const TEXT = params.get("text") || "obrigado pela forca amigo";
    const $text = document.getElementById("text-display");
    const $gloss = document.getElementById("gloss");
    const $btn = document.getElementById("btn-play");
    $text.textContent = TEXT;
    $text.hidden = false;

    function getGloss() {
      // tenta extrair gloss do que tá no player se visível
      const vw = document.querySelector("[vw-plugin-wrapper]");
      if (!vw) return null;
      const txt = vw.textContent || "";
      return txt.trim().split(/\s+/).filter(Boolean).slice(0, 20).join(" ");
    }

    function trigger() {
      $btn.disabled = true;
      $btn.textContent = "...";
      // hack: clica no botão de tradução do widget via a área dele
      // (VLibras expõe internamente; aqui disparamos via clicar no widget)
      const btn = document.querySelector("[vw-access-button]");
      if (btn) {
        btn.click();
        btn.classList.add("active");
      }
      // fallback: simula re-mount do widget forçando re-scan
      setTimeout(() => {
        const plugin = document.querySelector("[vw-plugin-wrapper] iframe");
        if (plugin && plugin.contentWindow) {
          // tenta postar mensagem de tradução (alguns widgets aceitam)
          plugin.contentWindow.postMessage({
            type: "vlibras:translate",
            text: TEXT
          }, "*");
        }
        // atualiza gloss display após 1.5s (tempo do player carregar)
        setTimeout(() => {
          const g = getGloss();
          if (g) $gloss.textContent = g;
          $btn.disabled = false;
          $btn.textContent = "▶ Tocar de novo";
        }, 1500);
      }, 100);
    }

    $btn.addEventListener("click", trigger);
    window.addEventListener("load", () => {
      $btn.disabled = false;
      // primeira execução automática após 3s (tempo do widget carregar)
      setTimeout(trigger, 3000);
    });
  </script>
</body>
</html>
