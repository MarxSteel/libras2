<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>libras2 player</title>
  <style>
    html, body {
      margin: 0 !important; padding: 0 !important;
      width: 100% !important; height: 100% !important;
      background: #fff !important;
      overflow: hidden !important;
    }
    /* esconde o botão de acesso (avatar pequeno que fica no canto) */
    [vw-access-button] { display: none !important; opacity: 0 !important; visibility: hidden !important; }
  </style>
</head>
<body>
  <!-- texto invisível pro widget escanear (precisa estar no DOM visível pro plugin) -->
  <p id="src" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;font-size:1px;color:transparent;line-height:1;">obrigado</p>

  <!-- VLibras widget oficial -->
  <div vw class="enabled">
    <div vw-access-button></div>
    <div vw-plugin-wrapper></div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const TEXT = params.get("text") || "obrigado";
    if (TEXT) document.getElementById("src").textContent = TEXT;
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>
</body>
</html>
