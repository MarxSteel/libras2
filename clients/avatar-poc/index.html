<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Libras2 — Avatar POC (Three.js + BVH)</title>
  <style>
    :root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --accent: #1f6feb;
      --accent-2: #58a6ff;
      --dim: #6e7681;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
    #app { position: relative; width: 100vw; height: 100vh; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* Header com logo + status */
    #header {
      position: absolute; top: 0; left: 0; right: 0; padding: 14px 20px;
      background: linear-gradient(to bottom, rgba(13,17,23,0.85), rgba(13,17,23,0));
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10; pointer-events: none;
    }
    #header h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
    #header h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
    #status { font-size: 12px; color: var(--dim); }

    /* Painel de controles */
    #controls {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 18px 20px 24px;
      background: linear-gradient(to top, rgba(13,17,23,0.95), rgba(13,17,23,0));
      z-index: 10;
    }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .row + .row { margin-top: 10px; }

    textarea, input[type="text"] {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
      color: var(--fg); border-radius: 6px; padding: 8px 10px; font: inherit;
      transition: border-color 0.15s;
    }
    textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
    textarea { flex: 1; min-width: 240px; height: 36px; resize: vertical; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    input[type="text"] { width: 100px; }

    button {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 9px 16px; font: 600 13px/1 inherit; cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover:not(:disabled) { background: var(--accent-2); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { background: var(--dim); cursor: not-allowed; }
    button.secondary { background: rgba(255,255,255,0.1); color: var(--fg); }
    button.secondary:hover:not(:disabled) { background: rgba(255,255,255,0.18); }
    button.danger { background: #da3633; }

    label { font-size: 12px; color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
    input[type="checkbox"] { accent-color: var(--accent); }

    /* Legenda de palavras */
    #caption {
      position: absolute; bottom: 120px; left: 0; right: 0;
      display: flex; justify-content: center; flex-wrap: wrap; gap: 12px;
      padding: 0 20px; z-index: 9; pointer-events: none;
    }
    .word {
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.55);
      padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 18px;
      letter-spacing: 0.5px; transition: all 0.25s ease;
    }
    .word.active {
      background: var(--accent); color: #fff; opacity: 1;
      transform: scale(1.05); box-shadow: 0 0 20px rgba(31,111,235,0.6);
    }

    /* Painel de log lateral */
    #log {
      position: absolute; top: 50px; right: 12px; width: 280px; max-height: 40vh;
      background: rgba(13,17,23,0.85); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; padding: 10px 12px; font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--dim); overflow-y: auto; z-index: 9;
    }
    #log .l-info { color: var(--fg); }
    #log .l-warn { color: #d29922; }
    #log .l-err { color: #f85149; }
    #log .l-ok { color: #3fb950; }
  </style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div id="header">
    <h1>Libras2 Avatar POC <small>Three.js + BVH</small></h1>
    <div id="status">Pronto</div>
  </div>

  <div id="log"><div class="l-info">[boot] Aguardando entrada…</div></div>

  <div id="caption"></div>

  <div id="controls">
    <div class="row">
      <label>Avatar:
        <select id="avatarSelect" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: var(--fg); border-radius: 6px; padding: 8px 10px; font: inherit;">
          <option value="">(detectando...)</option>
        </select>
      </label>
      <label>Modo:
        <select id="modeSelect" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: var(--fg); border-radius: 6px; padding: 8px 10px; font: inherit;">
          <option value="sinais" selected>Sinais (Libras keyframes)</option>
          <option value="misto">Misto (gesto + BVH)</option>
          <option value="danca">Dança (BVH round-robin)</option>
        </select>
      </label>
      <label><input type="checkbox" id="showHelperChk" /> Skeleton wireframe</label>
      <label><input type="checkbox" id="loopChk" /> Loop</label>
    </div>
    <div class="row">
      <label>Frase → gloss:
        <input type="text" id="textInput" value="olá amigo bom dia" placeholder="ex: olá amigo" />
      </label>
      <button id="btnTokenize" class="secondary">Tokenizar</button>
      <button id="btnPlay" disabled>▶ Tocar</button>
      <button id="btnStop" class="danger" disabled>■ Parar</button>
    </div>
    <div class="row">
      <button id="btnExport" class="secondary" disabled>⤓ Exportar MP4 (MediaRecorder)</button>
      <label id="exportInfo" style="color: var(--dim); font-size: 12px;"></label>
    </div>
  </div>
</div>

<!-- Three.js + loaders (módulos ES) -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { BVHLoader } from 'three/addons/loaders/BVHLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { captureRestPose, gestureToClip, resetSkeleton } from './lib/skeleton-utils.js';
import { lookupGesture, normalizeToken, GESTURES as GESTURE_LIB } from './lib/gestures.js';

// ============================================================================
// Logs
// ============================================================================
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
function log(msg, level = 'info') {
  const cls = { info: 'l-info', warn: 'l-warn', err: 'l-err', ok: 'l-ok' }[level] || 'l-info';
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString('pt-BR', { hour12: false })}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console[level === 'err' ? 'error' : 'log'](msg);
}
function setStatus(s) { statusEl.textContent = s; }

// ============================================================================
// Cena
// ============================================================================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0d1117, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 200, 1000);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
camera.position.set(0, 180, 400);

const controls = new OrbitControls(camera, canvas);
controls.minDistance = 150;
controls.maxDistance = 900;
controls.target.set(0, 100, 0);
controls.update();

// luzes
const amb = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(amb);
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(100, 200, 100);
scene.add(dir);

// chão (grid)
const grid = new THREE.GridHelper(800, 20, 0x30363d, 0x21262d);
grid.position.y = 0;
scene.add(grid);

// ============================================================================
// Avatar: GLB (humanóide) + BVH (animação) via SkeletonUtils.retargetClip
// ============================================================================
let avatarRoot = null;        // THREE.Object3D raiz do avatar (clonado por BVH/gesture)
let avatarHelper = null;      // SkeletonHelper pra debug
let mixer = null;             // THREE.AnimationMixer (modo BVH OU gesture)
let currentAction = null;
let currentClip = null;
let currentBVH = null;
let currentGesture = null;    // { gesture, normalized, t0 } (modo gesture via mixer)
const clock = new THREE.Clock();

// Selecionador de avatar (combobox na UI)
let availableAvatars = [];    // [{ name, url }]
let activeAvatar = null;      // { name, url, sceneTemplate }
let activeAvatarSkeleton = null;  // THREE.Skeleton do GLB
let activeAvatarRoot = null;      // THREE.Object3D raiz (template)

// Selecionador de BVH
const bvhFiles = ['bvh/pirouette.bvh', 'bvh/dance1.bvh', 'bvh/dance2.bvh'];

// cache de BVH carregados
const bvhCache = new Map();
async function loadBVH(url) {
  if (bvhCache.has(url)) return bvhCache.get(url);
  log(`carregando BVH: ${url}`);
  const loader = new BVHLoader();
  return new Promise((resolve, reject) => {
    loader.load(url, (result) => {
      bvhCache.set(url, result);
      log(`BVH ok: ${result.clip.duration.toFixed(2)}s, ${result.skeleton.bones.length} bones`, 'ok');
      resolve(result);
    }, undefined, (err) => {
      log(`falha BVH ${url}: ${err.message || err}`, 'err');
      reject(err);
    });
  });
}

// cache de GLBs carregados (template)
const glbCache = new Map();
async function loadGLB(url) {
  if (glbCache.has(url)) return glbCache.get(url);
  log(`carregando GLB: ${url}`);
  const loader = new GLTFLoader();
  return new Promise((resolve, reject) => {
    loader.load(url, (gltf) => {
      // extrai primeiro SkinnedMesh/Skeleton
      let skeleton = null;
      let root = null;
      gltf.scene.traverse((obj) => {
        if (obj.isSkinnedMesh && !skeleton) {
          skeleton = obj.skeleton;
          root = obj;
        }
      });
      if (!skeleton) {
        reject(new Error('GLB não tem SkinnedMesh'));
        return;
      }
      // captura rest pose (T-pose) — base pras interpolações de gesture
      const restPose = captureRestPose(root);
      const result = { gltf, skeleton, root, restPose };
      glbCache.set(url, result);
      log(`GLB ok: ${skeleton.bones.length} bones, ${gltf.scene.children.length} children, restPose ${restPose.size}`, 'ok');
      resolve(result);
    }, undefined, (err) => {
      log(`falha GLB ${url}: ${err.message || err}`, 'err');
      reject(err);
    });
  });
}

function clearAvatar() {
  if (avatarRoot) {
    scene.remove(avatarRoot);
    avatarRoot.traverse((obj) => {
      if (obj.isMesh) {
        obj.geometry?.dispose();
        if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
        else obj.material?.dispose();
      }
    });
    avatarRoot = null;
  }
  if (avatarHelper) {
    scene.remove(avatarHelper);
    avatarHelper.geometry.dispose();
    avatarHelper.material.dispose();
    avatarHelper = null;
  }
  if (mixer) {
    mixer.stopAllAction();
    mixer = null;
  }
  currentAction = null;
  currentClip = null;
  currentGesture = null;
}

/**
 * Aplica gesto (keyframes) ao avatar clonado.
 * Estratégia: constrói um "fake BVH" usando o skeleton do GLB + clip
 * do gesture, e reusa o pipeline do applyBVHToAvatar (que já funciona).
 */
function applyGestureToAvatar(gesture, normalized) {
  if (!activeAvatar) {
    log('sem avatar carregado', 'err');
    return;
  }
  clearAvatar();

  // clona o template do avatar
  const clone = SkeletonUtils.clone(activeAvatar.gltf.scene);
  let skinnedMesh = null;
  clone.traverse((obj) => {
    if (obj.isSkinnedMesh && !skinnedMesh) skinnedMesh = obj;
  });
  if (!skinnedMesh) {
    log('clone não tem SkinnedMesh', 'err');
    return;
  }

  // Constrói fake BVH: usa o skeleton do clone + clip do gesture
  const fakeClip = gestureToClip(gesture, normalized);
  const fakeBvhResult = {
    skeleton: skinnedMesh.skeleton,
    clip: fakeClip,
  };
  // hack: precisa estar "loaded" via BVHLoader — vamos setar o source do BVH pra enganar
  // Aplica direto
  scene.add(clone);
  avatarRoot = clone;

  // renomeia bones (no-op, já são Mixamo)
  renameBVHBones(fakeBvhResult);

  // retargetClip: source (skeleton do clone) → target (skinnedMesh)
  let retargetedClip = null;
  try {
    retargetedClip = SkeletonUtils.retargetClip(
      skinnedMesh,
      fakeBvhResult.skeleton,
      fakeBvhResult.clip
    );
  } catch (e) {
    log(`retargetClip gesture error: ${e.message}`, 'err');
  }
  if (!retargetedClip) {
    log('retargetClip gesture retornou null', 'err');
    return;
  }

  // Anexa root bone ao skinnedMesh (igual BVH pipeline)
  if (skinnedMesh.skeleton && skinnedMesh.skeleton.bones.length > 0) {
    const rootBone = skinnedMesh.skeleton.bones[0];
    if (rootBone.parent !== skinnedMesh) skinnedMesh.add(rootBone);
  }

  // mixer
  mixer = new THREE.AnimationMixer(skinnedMesh);
  currentAction = mixer.clipAction(retargetedClip);
  currentAction.setLoop(THREE.LoopRepeat);
  currentAction.play();
  currentClip = retargetedClip;
  currentGesture = { gesture, normalized, t0: performance.now() };

  // helper visual (opcional)
  if (document.getElementById('showHelperChk')?.checked) {
    avatarHelper = new THREE.SkeletonHelper(skinnedMesh);
    scene.add(avatarHelper);
  }

  setStatus(`Gesto: ${normalized} (${gesture.duration.toFixed(1)}s, ${retargetedClip.tracks.length} tracks)`);
}

// ============================================================================
// Mapeamento de bones BVH (CMU/pirouette) → Mixamo (GLB Soldier)
// pirouette.bvh tem formato CMU: hip, abdomen, chest, neck, head, lShldr, etc.
// GLB Mixamo tem prefixo mixamorig: mixamorigHips, mixamorigSpine, etc.
// ============================================================================
const BVH_TO_MIXAMO = {
  // tronco
  'hip': 'mixamorigHips',
  'abdomen': 'mixamorigSpine',
  'chest': 'mixamorigSpine1',
  // cabeça
  'neck': 'mixamorigNeck',
  'head': 'mixamorigHead',
  // ombros/braços (CMU usa rShldr/lShldr, Mixamo usa Arm + ForeArm)
  'rCollar': 'mixamorigRightShoulder',
  'rShldr': 'mixamorigRightArm',
  'rForeArm': 'mixamorigRightForeArm',
  'rHand': 'mixamorigRightHand',
  'lCollar': 'mixamorigLeftShoulder',
  'lShldr': 'mixamorigLeftArm',
  'lForeArm': 'mixamorigLeftForeArm',
  'lHand': 'mixamorigLeftHand',
  // pernas (CMU usa rThigh/lThigh, Mixamo usa UpLeg + Leg)
  'rButtock': 'mixamorigRightUpLeg',
  'rThigh': 'mixamorigRightUpLeg',
  'rShin': 'mixamorigRightLeg',
  'rFoot': 'mixamorigRightFoot',
  'lButtock': 'mixamorigLeftUpLeg',
  'lThigh': 'mixamorigLeftUpLeg',
  'lShin': 'mixamorigLeftLeg',
  'lFoot': 'mixamorigLeftFoot',
  // dedos (CMU usa rThumb1, rIndex1, etc.)
  'rThumb1': 'mixamorigRightHandThumb1',
  'rThumb2': 'mixamorigRightHandThumb2',
  'rIndex1': 'mixamorigRightHandIndex1',
  'rIndex2': 'mixamorigRightHandIndex2',
  'rMid1': 'mixamorigRightHandMiddle1',
  'rMid2': 'mixamorigRightHandMiddle2',
  'rRing1': 'mixamorigRightHandRing1',
  'rRing2': 'mixamorigRightHandRing2',
  'rPinky1': 'mixamorigRightHandPinky1',
  'rPinky2': 'mixamorigRightHandPinky2',
  'lThumb1': 'mixamorigLeftHandThumb1',
  'lThumb2': 'mixamorigLeftHandThumb2',
  'lIndex1': 'mixamorigLeftHandIndex1',
  'lIndex2': 'mixamorigLeftHandIndex2',
  'lMid1': 'mixamorigLeftHandMiddle1',
  'lMid2': 'mixamorigLeftHandMiddle2',
  'lRing1': 'mixamorigLeftHandRing1',
  'lRing2': 'mixamorigLeftHandRing2',
  'lPinky1': 'mixamorigLeftHandPinky1',
  'lPinky2': 'mixamorigLeftHandPinky2',
};

// Renomeia bones BVH (in-place) para casar com Mixamo
// Retorna o número de bones renomeados
function renameBVHBones(bvhResult) {
  let renamed = 0;
  for (const bone of bvhResult.skeleton.bones) {
    if (BVH_TO_MIXAMO[bone.name]) {
      bone.name = BVH_TO_MIXAMO[bone.name];
      renamed++;
    }
  }
  return renamed;
}

// Aplica o BVH no avatar (retarget via SkeletonUtils.retargetClip)
function applyBVHToAvatar(bvhResult) {
  if (!activeAvatar) {
    log('sem avatar carregado', 'err');
    return;
  }
  clearAvatar();

  // clona o template do avatar (precisa ser clone pra retarget não mexer no original)
  const clone = SkeletonUtils.clone(activeAvatar.gltf.scene);
  // acha o SkinnedMesh no clone
  let skinnedMesh = null;
  clone.traverse((obj) => {
    if (obj.isSkinnedMesh && !skinnedMesh) skinnedMesh = obj;
  });
  if (!skinnedMesh) {
    log('clone não tem SkinnedMesh', 'err');
    return;
  }

  // renomeia os bones BVH pra match Mixamo
  const renamed = renameBVHBones(bvhResult);
  log(`renomeei ${renamed}/${bvhResult.skeleton.bones.length} bones BVH → Mixamo`, 'info');

  // retarget: pega o clip do BVH e aplica no skeleton do clone
  // signature: retargetClip(target, source, clip, options)
  //   target = Object3D com SkinnedMesh (do GLB)
  //   source = skeleton do BVH (THREE.Skeleton, com .bones renomeados)
  //   clip   = AnimationClip do BVH
  let retargetedClip;
  try {
    retargetedClip = SkeletonUtils.retargetClip(
      skinnedMesh,                 // target: Object3D com SkinnedMesh
      bvhResult.skeleton,          // source: THREE.Skeleton (tem .bones)
      bvhResult.clip                // clip: AnimationClip
    );
  } catch (e) {
    log(`retargetClip error: ${e.message}`, 'err');
    retargetedClip = null;
  }
  log(`retargetClip result: ${retargetedClip ? `${retargetedClip.tracks.length} tracks` : 'null'}`, 'info');

  if (!retargetedClip) {
    log('retargetClip retornou null — fallback sem retarget', 'warn');
    // fallback: toca o clip original mesmo (vai dar bug mas pelo menos vê algo)
    skinnedMesh.add(bvhResult.skeleton.bones[0]);
    scene.add(clone);
    avatarRoot = clone;
    mixer = new THREE.AnimationMixer(skinnedMesh);
    currentAction = mixer.clipAction(bvhResult.clip);
    currentAction.setLoop(THREE.LoopRepeat);
    currentAction.play();
    return;
  }

  // adiciona o root bone do BVH como filho do skinnedMesh (pra hierarquia)
  skinnedMesh.add(bvhResult.skeleton.bones[0]);

  // adiciona o clone na cena
  scene.add(clone);
  avatarRoot = clone;

  // mixer com o clip retargetado
  mixer = new THREE.AnimationMixer(skinnedMesh);
  currentAction = mixer.clipAction(retargetedClip);
  currentAction.setLoop(THREE.LoopRepeat);
  currentAction.play();
  currentClip = retargetedClip;
  currentBVH = bvhResult;

  // helper visual (opcional, debug)
  if (document.getElementById('showHelperChk')?.checked) {
    avatarHelper = new THREE.SkeletonHelper(skinnedMesh);
    scene.add(avatarHelper);
  }

  setStatus(`Tocando: ${currentClip.duration.toFixed(1)}s, ${retargetedClip.tracks.length} tracks (${bvhResult.skeleton.bones.length} bones BVH → ${skinnedMesh.skeleton.bones.length} bones GLB)`);
}

// ============================================================================
// Sequência: tocar N BVHs em ordem, com caption highlighting
// ============================================================================
const captionEl = document.getElementById('caption');
let sequence = [];            // [{ word, bvhUrl, duration }]
let seqIndex = 0;
let seqStart = 0;
let seqTimer = null;
let isPlaying = false;

function tokenize(text) {
  // Demo: split simples por espaço. No real, viria do VLibras/LSCh backend
  return text.trim().split(/\s+/).filter(Boolean);
}

function buildSequence(words) {
  // Modo "sinais" (default): usa gestos (keyframes Libras) com lookup.
  // Se palavra não tem gesto: fallback BVH (round-robin).
  // Suporta compostos (BOM DIA → 1 gesto único).
  const mode = document.getElementById('modeSelect')?.value || 'sinais';
  const bvhFiles = ['bvh/pirouette.bvh', 'bvh/dance1.bvh', 'bvh/dance2.bvh'];
  const seq = [];
  let i = 0;
  let bvhIdx = 0;
  while (i < words.length) {
    const remaining = words.slice(i);
    let pushed = false;
    if (mode !== 'danca') {
      const match = lookupGesture(remaining[0], remaining.slice(1));
      if (match) {
        seq.push({
          word: remaining.slice(0, match.consumed).join(' '),
          type: 'gesture',
          gesture: match.gesture,
          duration: match.gesture.duration + 0.2, // +0.2s de folga entre gestos
          matched: match.normalized,
        });
        i += match.consumed;
        pushed = true;
      }
    }
    if (!pushed) {
      seq.push({
        word: remaining[0],
        type: 'bvh',
        bvhUrl: bvhFiles[bvhIdx % bvhFiles.length],
        duration: 1.5,
      });
      bvhIdx++;
      i++;
    }
  }
  return seq;
}

async function ensureSequence(words) {
  // monta a sequência (gestos + fallback BVH)
  const seq = buildSequence(words);
  // pré-carrega apenas os BVHs de fallback
  const bvhUrls = [...new Set(seq.filter(s => s.type === 'bvh').map(s => s.bvhUrl))];
  await Promise.all(bvhUrls.map(url => loadBVH(url).catch(() => null)));
  return seq;
}

function renderCaption(words, activeIdx) {
  captionEl.innerHTML = '';
  words.forEach((w, i) => {
    const span = document.createElement('span');
    span.className = 'word' + (i === activeIdx ? ' active' : '');
    span.textContent = w.toUpperCase();
    captionEl.appendChild(span);
  });
}

async function playSequence(words) {
  if (isPlaying) return;
  sequence = await ensureSequence(words);
  if (sequence.length === 0) {
    log('sequência vazia', 'warn');
    return;
  }
  isPlaying = true;
  seqIndex = 0;
  setStatus(`Sequência: ${words.join(' ')}`);
  document.getElementById('btnPlay').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('btnExport').disabled = false;
  document.getElementById('exportInfo').textContent = '';
  nextInSequence();
}

function nextInSequence() {
  if (!isPlaying) return;
  if (seqIndex >= sequence.length) {
    if (document.getElementById('loopChk').checked) {
      log('loop: reiniciando', 'info');
      seqIndex = 0;
    } else {
      stopSequence();
      return;
    }
  }
  const item = sequence[seqIndex];
  const tag = item.type === 'gesture'
    ? `gesto ${item.matched} (${item.gesture.duration.toFixed(1)}s)`
    : `BVH ${item.bvhUrl.split('/').pop()}`;
  log(`[${seqIndex + 1}/${sequence.length}] ${item.word} ← ${tag}`);
  renderCaption(sequence.map(s => s.word), seqIndex);
  if (item.type === 'gesture') {
    applyGestureToAvatar(item.gesture, item.matched);
  } else {
    const bvh = bvhCache.get(item.bvhUrl);
    if (bvh) {
      applyBVHToAvatar(bvh);
    } else {
      log(`BVH não carregado: ${item.bvhUrl}`, 'err');
    }
  }
  seqStart = performance.now();
  seqTimer = setTimeout(() => {
    seqIndex++;
    nextInSequence();
  }, item.duration * 1000);
}

function stopSequence() {
  isPlaying = false;
  if (seqTimer) {
    clearTimeout(seqTimer);
    seqTimer = null;
  }
  renderCaption([], -1);
  clearAvatar();
  setStatus('Parado');
  document.getElementById('btnPlay').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnExport').disabled = true;
}

// ============================================================================
// Export: MediaRecorder API (webm) → download
// ============================================================================
let mediaRecorder = null;
let recordedChunks = [];
async function exportRecording() {
  if (!isPlaying) {
    log('inicie a sequência antes de exportar', 'warn');
    return;
  }
  log('exportando: capturando canvas via MediaRecorder…', 'info');
  const stream = canvas.captureStream(30); // 30 fps
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_000_000 });
  recordedChunks = [];
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `libras2-poc-${Date.now()}.webm`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    log(`exportado: ${(blob.size / 1024).toFixed(0)} KB`, 'ok');
    document.getElementById('exportInfo').textContent = `exportado ${(blob.size / 1024).toFixed(0)} KB`;
    mediaRecorder = null;
  };
  mediaRecorder.start();
  document.getElementById('exportInfo').textContent = 'gravando…';
  // para automaticamente quando a sequência acabar
  const checkEnd = setInterval(() => {
    if (!isPlaying && mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      clearInterval(checkEnd);
    }
  }, 200);
}

// ============================================================================
// Loop de animação
// ============================================================================
function tick() {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================================
// UI bindings
// ============================================================================
const textInput = document.getElementById('textInput');
const btnTokenize = document.getElementById('btnTokenize');
const btnPlay = document.getElementById('btnPlay');
const btnStop = document.getElementById('btnStop');
const btnExport = document.getElementById('btnExport');

btnTokenize.addEventListener('click', async () => {
  const text = textInput.value;
  const words = tokenize(text);
  if (!words.length) { log('texto vazio', 'warn'); return; }
  log(`tokenizado: ${words.join(' | ')} (${words.length} palavras)`);
  btnPlay.disabled = false;
  // pré-carrega os BVHs
  await ensureSequence(words);
  log('BVHs prontos — pode tocar', 'ok');
});

btnPlay.addEventListener('click', () => playSequence(tokenize(textInput.value)));
btnStop.addEventListener('click', stopSequence);
btnExport.addEventListener('click', exportRecording);
textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnTokenize.click(); });

// seletor de avatar
const avatarSelect = document.getElementById('avatarSelect');
avatarSelect.addEventListener('change', async () => {
  const url = avatarSelect.value;
  if (!url) return;
  stopSequence();
  clearAvatar();
  activeAvatar = await loadGLB(url);
  log(`avatar ativo: ${url.split('/').pop()} (${activeAvatar.skeleton.bones.length} bones)`);
  setStatus(`Avatar: ${url.split('/').pop()}`);
});

// ============================================================================
// Boot: detectar GLBs disponíveis + carregar o primeiro
// ============================================================================
async function detectGLBs() {
  // tenta uma lista conhecida (extensível)
  const candidates = ['glb/Soldier.glb', 'glb/RobotExpressive.glb'];
  const found = [];
  for (const url of candidates) {
    try {
      // usa GET com Range: bytes=0-0 (alguns servers não aceitam HEAD)
      const r = await fetch(url, { method: 'GET', headers: { Range: 'bytes=0-0' } });
      if (r.ok || r.status === 206) {
        found.push({ name: url.split('/').pop().replace('.glb', ''), url });
      }
    } catch (_) {}
  }
  return found;
}

(async () => {
  log('POC v3 — GLB + gestos Libras (keyframes) + BVH fallback', 'ok');
  log(`biblioteca de gestos: ${Object.keys(GESTURE_LIB).length} entradas`, 'ok');
  log('detectando avatares disponíveis…', 'info');
  availableAvatars = await detectGLBs();
  if (availableAvatars.length === 0) {
    log('nenhum GLB encontrado em glb/ — rode ./setup.sh', 'err');
    return;
  }
  // popula seletor
  avatarSelect.innerHTML = '';
  availableAvatars.forEach((a) => {
    const opt = document.createElement('option');
    opt.value = a.url;
    opt.textContent = a.name;
    avatarSelect.appendChild(opt);
  });
  // carrega o primeiro
  activeAvatar = await loadGLB(availableAvatars[0].url);
  // expõe no window pra debug
  window.__debug = { activeAvatar, bvhCache, glbCache, skeletonUtils: SkeletonUtils, THREE, GESTURE_LIB };
  log(`avatar padrão: ${availableAvatars[0].name} (${activeAvatar.skeleton.bones.length} bones)`, 'ok');
  // dump bone names
  const names = activeAvatar.skeleton.bones.map((b) => b.name);
  log(`GLB bones (${names.length}): ${names.slice(0, 10).join(', ')}…`, 'info');
  setStatus(`Avatar: ${availableAvatars[0].name}`);
  log('frase padrão pronta: "olá amigo bom dia" — clique Tocar!', 'ok');
})();
</script>
